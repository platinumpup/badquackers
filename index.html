<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>Sgt. Quackers: Burn Another Day</title>

<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#0b0f19">
</head>


<body>


<!-- ==========================
     INTRO VIDEO
========================== -->


<div id="introScreen">

    <video
        id="introVideo"
        autoplay
        muted
        playsinline
    >

        <source
            src="assets/splash.mp4"
            type="video/mp4"
        >

    </video>

</div>






<!-- ==========================
     TITLE SCREEN
========================== -->


<div id="titleScreen">


    <img
        id="splashGif"
        src="assets/splash.gif"
        alt="Sgt Quackers Intro"
    >



    <div id="bootOverlay">



        <div id="systemStatus">

            INITIALIZING SYSTEM...

        </div>



        <div id="loadingContainer">


            <div id="loadingBar">


                <div id="loadingFill"></div>


            </div>



            <div id="loadingPercent">

                0%

            </div>


        </div>



    </div>






    <button
        id="play"
        disabled
    >

        INITIATE MISSION

    </button>





    <div id="copyright">


        © 2026 PlatinumBoy

        <br>

        A StrangeCulture Creative Studios Production


    </div>



</div>







<!-- ==========================
     GAME HUD
========================== -->


<div id="hud">


    <div id="topLeftHud">


        <div>

            SCORE:

            <span id="score">

                000000

            </span>


        </div>



        <div>

            DISTANCE:

            <span id="distance">

                00000 M

            </span>


        </div>


    </div>





    <div id="sectorHud">


        SECTOR

        <span id="sector">

            01

        </span>


    </div>





    <div id="weaponHud">


        <div>

            WEAPON

        </div>



        <div id="weapon">

            TACTICAL RIFLE

        </div>



        <div>

            LEVEL

            <span id="weaponLevel">

                1

            </span>


        </div>


    </div>






    <div id="healthHud">


        <div>

            HULL

        </div>



        <div id="healthBar">


            <div id="healthFill"></div>


        </div>



        <div id="healthText">

            100%

        </div>


    </div>






    <button id="muteButton">

        🔊

    </button>



</div>








<!-- ==========================
     GAME CANVAS
========================== -->


<canvas id="game"></canvas>








<!-- ==========================
     GAME OVER
========================== -->


<div id="gameOver">


    <h1>

        GAME OVER

    </h1>



    <h2 id="gameOverSubtitle">

        No one could help put out your fire

    </h2>





    <div id="results">


        SCORE:

        <span id="finalScore">

            000000

        </span>


        <br>


        DISTANCE:

        <span id="finalDistance">

            00000 M

        </span>


        <br>


        BEST:

        <span id="bestScore">

            000000

        </span>


    </div>





    <button id="redeploy">

        BURN ANOTHER DAY

    </button>



</div>







<script src="game.js"></script>
<script>

if("serviceWorker" in navigator){

    window.addEventListener(
    "load",
    ()=>{

        navigator.serviceWorker.register(
            "service-worker.js"
        );

    });

}

</script>

</body>

</html>
